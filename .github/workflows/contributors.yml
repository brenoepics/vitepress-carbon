# Refreshes the contributor roll shown on the demo home page.
#
# The script counts commits, pull requests, issues, reviews and comments, so
# anyone who took part shows up — not just people who pushed code. It rewrites
# packages/demo/.vitepress/theme/data/contributors.json only when the people or
# their counts actually change, so a quiet week produces no pull request.

name: Contributors

on:
  schedule:
    # Mondays at 06:15 UTC.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@fd19e0626188613eec92a77e875180c6445b56ba # v1
        with:
          node-version: '22.18.0'
          cache: false
          run-install: false

      # No dependencies needed — the script is plain Node using global fetch.
      - name: Collect contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/fetch-contributors.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- packages/demo/.vitepress/theme/data/contributors.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No contributor changes this week."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- packages/demo/.vitepress/theme/data/contributors.json
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-contributors
          base: main
          commit-message: 'chore(demo): refresh contributor roll'
          title: 'chore(demo): refresh contributor roll'
          body: |
            Weekly refresh of the contributor list on the demo home page.

            Counts commits, pull requests, issues, reviews and comments, so
            everyone who took part is credited. Generated by
            `.github/workflows/contributors.yml` — review the diff and merge.
          labels: automated
          add-paths: packages/demo/.vitepress/theme/data/contributors.json
          delete-branch: true
